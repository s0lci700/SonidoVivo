spring.application.name=ms-usuarios
server.port=8082

# MariaDB de XAMPP (módulo "MySQL"). Cada microservicio tiene su propia base de datos.
# Puerto, usuario y clave se pueden cambiar con DB_PORT, DB_USER y DB_PASSWORD.
spring.datasource.url=jdbc:mariadb://localhost:${DB_PORT:3306}/sonidovivo_usuarios?createDatabaseIfNotExist=true
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# XAMPP trae MariaDB 10.4. El dialecto por defecto de Hibernate 7 exige 10.6 y,
# con 10.4, no logra crear claves foráneas ni restricciones UNIQUE.
spring.jpa.database-platform=org.hibernate.community.dialect.MariaDBLegacyDialect

# update crea/ajusta las tablas desde las entidades (solo para desarrollo).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Swagger UI en http://localhost:8082/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

# --- Seguridad (S15) ---
# Clave HMAC con la que ms-usuarios firma los JWT y los otros dos los verifican.
# Debe ser la MISMA en los tres microservicios y tener al menos 32 caracteres.
# El valor por defecto es solo para desarrollo: en producción se define JWT_SECRET.
jwt.secret=${JWT_SECRET:sonido-vivo-clave-solo-para-desarrollo-local-2026}
# Duración del token. Al vencer, React pide iniciar sesión otra vez (no hay refresh token).
jwt.expiracion-minutos=${JWT_MINUTOS:60}
# Origen del frontend que puede llamar a la API desde el navegador (CORS).
cors.origen=${FRONTEND_URL:http://localhost:5173}
# Sin esto Spring Boot crea un usuario "user" con clave aleatoria que no usamos.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
