spring.application.name=ms-pedidos
server.port=8083

# MariaDB de XAMPP (módulo "MySQL"). Cada microservicio tiene su propia base de datos.
# Puerto, usuario y clave se pueden cambiar con DB_PORT, DB_USER y DB_PASSWORD.
spring.datasource.url=jdbc:mariadb://localhost:${DB_PORT:3306}/sonidovivo_pedidos?createDatabaseIfNotExist=true
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# XAMPP trae MariaDB 10.4. El dialecto por defecto de Hibernate 7 exige 10.6 y,
# con 10.4, no logra crear claves foráneas ni restricciones UNIQUE.
spring.jpa.database-platform=org.hibernate.community.dialect.MariaDBLegacyDialect

# update crea/ajusta las tablas desde las entidades (solo para desarrollo).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Swagger UI en http://localhost:8083/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
