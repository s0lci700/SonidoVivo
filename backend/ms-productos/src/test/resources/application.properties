# Configuración solo para mvn test: base H2 en memoria en vez de MariaDB/XAMPP.
spring.application.name=ms-productos-test
spring.datasource.url=jdbc:h2:mem:ms-productos;MODE=MariaDB;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
jwt.secret=clave-de-pruebas-con-al-menos-treinta-y-dos-caracteres
cors.origen=http://localhost:5173
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
