spring.application.name=ms-productos
server.port=8081

# MySQL local (XAMPP). Cada microservicio tiene su propia base de datos.
spring.datasource.url=jdbc:mysql://localhost:3306/sonidovivo_productos?createDatabaseIfNotExist=true&serverTimezone=America/Santiago
spring.datasource.username=root
spring.datasource.password=

# update crea/ajusta las tablas desde las entidades (solo para desarrollo).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Swagger UI en http://localhost:8081/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
