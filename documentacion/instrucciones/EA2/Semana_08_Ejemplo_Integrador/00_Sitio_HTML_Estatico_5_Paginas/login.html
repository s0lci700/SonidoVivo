<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login · Mini Tienda DSY1104</title>
  <link rel="stylesheet" href="css/estilos.css" />
</head>
<body>
  <!-- Versión 00: estructura repetida intencionalmente para luego convertirla en componentes React. -->
  <header class="site-header">
  <div class="header-inner">
    <h1>Mini Tienda DSY1104</h1>
    <p>Ejemplo integrador HTML → React</p>
  </div>
</header>
  <nav class="site-nav">
  <div class="nav-inner">
    <a href="index.html">Inicio</a>
    <a href="productos.html">Productos</a>
    <a href="contacto.html">Contacto</a>
    <a href="login.html">Login</a>
    <a href="admin.html">Admin</a>
  </div>
</nav>

  <main class="main-container">
    <section class="form-card">
      <h2>Login administrador</h2>
      <p>Credenciales de prueba: <strong>admin / admin123</strong></p>

      <form id="form-login" novalidate>
        <div class="form-group">
          <label for="usuario">Usuario</label>
          <input id="usuario" name="usuario" type="text" autocomplete="username" />
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password" />
        </div>

        <button class="primary" type="submit">Ingresar</button>
        <div id="resultado-login" aria-live="polite"></div>
      </form>
    </section>
  </main>

  <footer class="site-footer">
  <div class="footer-inner">
    <p>© 2026 DSY1104 · Ejemplo académico</p>
  </div>
</footer>

  <script src="js/login.js"></script>
</body>
</html>
