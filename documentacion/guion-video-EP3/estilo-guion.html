<style>
  :root {
    --tinta: #1f1a14; --suave: #5b5247; --laton: #8a6414; --laton-claro: #f3e7c8;
    --fondo: #faf7f0; --papel: #ffffff; --borde: #e4dccb; --dicho: #fff8e6;
  }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--fondo); color: var(--tinta);
    font: 17px/1.65 "Segoe UI", system-ui, sans-serif;
    display: grid; grid-template-columns: 270px minmax(0, 1fr); max-width: none; padding: 0;
  }
  /* Índice lateral fijo */
  nav#TOC {
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
    background: #241e17; color: #e9dfcc; padding: 22px 16px; box-sizing: border-box; font-size: 14px;
  }
  nav#TOC::before { content: "Guion · bloques"; display: block; font-weight: 700; color: #e0b54a;
    letter-spacing: .04em; text-transform: uppercase; font-size: 12px; margin-bottom: 10px; }
  nav#TOC ul { list-style: none; margin: 0; padding: 0; }
  nav#TOC > ul > li > a { display: none; }
  nav#TOC a { display: block; color: #e9dfcc; text-decoration: none; padding: 6px 10px; border-radius: 6px; }
  nav#TOC a:hover, nav#TOC a.activo { background: #3a3025; color: #fff; }
  main, body > header, body > .contenido { grid-column: 2; }
  .contenido { max-width: 860px; margin: 0 auto; padding: 36px 40px 120px; }
  header#title-block-header { display: none; }

  h1 { font-size: 34px; color: var(--laton); margin: 0 0 12px; line-height: 1.2; }
  h2 {
    font-size: 23px; margin: 56px 0 14px; padding: 12px 16px; line-height: 1.3;
    background: var(--papel); border: 1px solid var(--borde); border-left: 6px solid var(--laton);
    border-radius: 8px; scroll-margin-top: 16px;
  }
  h2 em { font-style: normal; font-size: 14px; color: var(--laton); background: var(--laton-claro);
    padding: 2px 8px; border-radius: 99px; vertical-align: middle; white-space: nowrap; }
  p, li { max-width: 72ch; }
  li { margin: 6px 0; }
  code { font-family: Consolas, monospace; font-size: .88em; background: #efe8d8; padding: 1px 5px; border-radius: 4px; }
  strong { color: #000; }

  /* Lo que se dice en voz alta */
  blockquote {
    margin: 16px 0; padding: 14px 18px 14px 52px; position: relative;
    background: var(--dicho); border: 1px solid #ecd9a6; border-radius: 10px;
    font-size: 18px; line-height: 1.6; color: #2b2116;
  }
  blockquote::before { content: "🎙"; position: absolute; left: 16px; top: 12px; font-size: 22px; }
  blockquote p { margin: 6px 0; }

  /* Capturas: miniatura legible, clic para ampliar */
  figure { margin: 18px 0 26px; }
  figure img, p > img {
    display: block; width: 100%; max-width: 640px; height: auto; cursor: zoom-in;
    border: 1px solid var(--borde); border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
    transition: transform .15s;
  }
  figure img:hover { transform: translateY(-2px); }
  figcaption { font-size: 14px; color: var(--suave); margin-top: 6px; max-width: 640px; }
  #visor { position: fixed; inset: 0; background: rgba(15,12,9,.92); display: none;
    align-items: center; justify-content: center; z-index: 10; cursor: zoom-out; padding: 24px; }
  #visor.abierto { display: flex; }
  #visor img { max-width: 100%; max-height: 100%; border-radius: 6px; }
  #visor span { position: fixed; bottom: 14px; left: 0; right: 0; text-align: center; color: #ddd; font-size: 14px; }

  table { border-collapse: collapse; }
  @media (max-width: 900px) {
    body { display: block; } nav#TOC { display: none; } .contenido { padding: 20px; }
  }
  @media print {
    body { display: block; } nav#TOC, #visor { display: none; } figure img { max-width: 480px; }
  }
</style>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    // Mueve el contenido a una columna centrada
    const toc = document.getElementById("TOC");
    const cont = document.createElement("div"); cont.className = "contenido";
    [...document.body.children].forEach(n => { if (n !== toc && n.tagName !== "SCRIPT") cont.appendChild(n); });
    document.body.appendChild(cont);
    // Visor de capturas
    const visor = document.createElement("div"); visor.id = "visor";
    visor.innerHTML = '<img alt=""><span>Clic o Esc para cerrar</span>';
    document.body.appendChild(visor);
    const cerrar = () => visor.classList.remove("abierto");
    visor.onclick = cerrar; document.onkeydown = e => { if (e.key === "Escape") cerrar(); };
    document.querySelectorAll(".contenido img").forEach(img => img.onclick = () => {
      visor.querySelector("img").src = img.src; visor.classList.add("abierto");
    });
    // Resalta en el índice el bloque visible
    const enlaces = [...document.querySelectorAll("nav#TOC a")];
    const obs = new IntersectionObserver(es => es.forEach(e => {
      if (e.isIntersecting) enlaces.forEach(a => a.classList.toggle("activo", a.getAttribute("href") === "#" + e.target.id));
    }), { rootMargin: "0px 0px -70% 0px" });
    document.querySelectorAll("h2[id]").forEach(h => obs.observe(h));
  });
</script>
